# Local development databases for PrinZex.
# Start all three with:  docker compose up -d
# Then sync the Postgres schema:  npx prisma db push
# The same stack maps 1:1 to free-tier cloud equivalents when you're ready to
# deploy (see README): Neon/Supabase (Postgres), Upstash (Redis), Atlas (Mongo).
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: prinzex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prinzex
      POSTGRES_PASSWORD: prinzex
      POSTGRES_DB: prinzex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: prinzex-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mongodb:
    image: mongo:7
    container_name: prinzex-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: prinzex
      MONGO_INITDB_ROOT_PASSWORD: prinzex
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  redis_data:
  mongo_data:
