# CI — the quality gates from the docs (section: Verification & Quality
# Gates), enforced on every PR (and after merges to main):
#
#   install → tsc --noEmit → lint → all check scripts
#
# The check scripts are self-contained by design (pg-mem, mock servers,
# pure functions) — no databases or sidecars are needed. The backend's
# tsc gate needs the generated Prisma client, so `prisma generate` runs
# first (same as the local runbook's `npm run db:generate`).
#
# Adding a new scripts/check-* file automatically adds it to the gate —
# no workflow edit needed.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — typecheck, lint, check scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prinzex-backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: prinzex-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run check scripts
        run: |
          status=0
          for script in scripts/check-*; do
            echo "::group::$script"
            if ! npx tsx "$script"; then
              status=1
              echo "::error file=${script}::${script} FAILED"
            fi
            echo "::endgroup::"
          done
          exit $status

  frontend:
    name: Frontend — typecheck, lint, check scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run check scripts
        run: |
          status=0
          for script in scripts/check-*; do
            echo "::group::$script"
            if ! npx tsx "$script"; then
              status=1
              echo "::error file=${script}::${script} FAILED"
            fi
            echo "::endgroup::"
          done
          exit $status
